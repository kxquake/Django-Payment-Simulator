{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Send money{% endblock %}
{% block content %}
<h1>Send money</h1>
<form method="post" action="{% url 'make_payment' %}">
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary">Send</button>

</form>
{% endblock %}
