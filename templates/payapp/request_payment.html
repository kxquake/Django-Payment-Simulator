{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Request money{% endblock %}
{% block content %}
<h1>Request money</h1>
<form method="post" action="{% url 'request_payment' %}">
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary">Send request</button>
</form>
{% endblock %}
