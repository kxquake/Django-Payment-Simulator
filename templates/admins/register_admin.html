{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Register administrator{% endblock %}
{% block content %}
<h1>Register a new administrator</h1>
<form method="post" action="{% url 'admin_register' %}">
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary">Create administrator</button>
</form>
{% endblock %}
